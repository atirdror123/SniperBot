name: Daily Stock Scanner

on:
  schedule:
    # Run at 14:45 UTC daily (15 mins after US market open at 9:30 ET always covered)
    # Winter: 9:45 EST (Market opens 9:30 EST)
    # Summer: 10:45 EDT (Market opens 9:30 EDT)
    - cron: '45 14 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'
      SUPABASE_KEY: '${{ secrets.SUPABASE_KEY }}'
      FMP_API_KEY: '${{ secrets.FMP_API_KEY }}'
      GOOGLE_API_KEY: '${{ secrets.GOOGLE_API_KEY }}'
      DISCORD_WEBHOOK_URL: '${{ secrets.DISCORD_WEBHOOK_URL }}'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Sentient Sniper
      run: python main_sentient.py
