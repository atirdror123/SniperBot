name: Daily Sniper Scan V2.0

on:
  schedule:
    # Run at 14:45 UTC daily (15 mins after US market open)
    - cron: '45 14 * * 1-5'  # Only weekdays
  workflow_dispatch:

jobs:
  sniper_scan:
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'
      SUPABASE_KEY: '${{ secrets.SUPABASE_KEY || secrets.SUPABASEKEY }}'
      FMP_API_KEY: '${{ secrets.FMP_API_KEY }}'
      GOOGLE_API_KEY: '${{ secrets.GOOGLE_API_KEY }}'
      DISCORD_WEBHOOK_URL: '${{ secrets.DISCORD_WEBHOOK_URL }}'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Sniper Scanner V2.0
      run: python run_sniper_scan.py

