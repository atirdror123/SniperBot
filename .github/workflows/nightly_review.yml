name: Nightly Review (Self-Learning)

on:
  schedule:
    # Run at 22:00 UTC daily (after market close)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'
      SUPABASE_KEY: '${{ secrets.SUPABASE_KEY || secrets.SUPABASEKEY }}'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Nightly Review
      run: python nightly_review.py
