name: Position Monitor (Hourly)

on:
  schedule:
    # Run every hour during market hours (13:30-20:00 UTC = 9:30-4:00 ET)
    - cron: '30 13-20 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'
      SUPABASE_KEY: '${{ secrets.SUPABASE_KEY || secrets.SUPABASEKEY }}'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Check Positions & Update Equity
      run: python position_manager.py
